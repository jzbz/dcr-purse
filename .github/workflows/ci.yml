name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Differential tests must run in CI: a missing oracle is a failure, not a skip.
  PURSE_REQUIRE_ORACLE: "1"
  # The reference Go: the release every oracle binary is built with.  Go
  # itself authors some of what the oracle pins, so this moves by a
  # deliberate bump, together with REFERENCE_GO in purse-testutil, which
  # refuses an oracle built with any other release.
  GO_VERSION: "1.27.4"

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No toolchain action: rust-toolchain.toml names the version and its
      # components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # fuzz/ is a workspace of its own; resolving it with --locked fails
      # when its lock has fallen behind its manifest.
      - run: cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/oracle/go.sum
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --no-fail-fast

  test-wrapping:
    name: test (overflow checks off, as release ships)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "false"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/oracle/go.sum
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --no-fail-fast

  oracle:
    name: go vet and go test (tools/oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/oracle/go.sum
      - run: go vet ./...
        working-directory: tools/oracle
      # The oracle carries verbatim copies of dcrwallet code it cannot
      # import (internal packages, unexported functions); these tests fail
      # unless each copy still matches the pinned module.
      - run: go test ./...
        working-directory: tools/oracle

  flint:
    name: FLINT differential (purse-mixsolver)
    # The reference root solver is Go over the C library FLINT.  FLINT comes
    # from the image's archive, so the image is pinned, not ubuntu-latest.
    runs-on: ubuntu-26.04
    env:
      PURSE_REQUIRE_FLINT: "1"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/oracle/go.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libflint-dev libgmp-dev libmpfr-dev
      - uses: Swatinem/rust-cache@v2
      - run: go vet -tags flint ./cmd/mixsolver
        working-directory: tools/oracle
      - name: Build the FLINT oracle and the reference csppsolver
        working-directory: tools/oracle
        run: |
          go build -tags flint -o "$RUNNER_TEMP/oracle/purse-oracle-mixsolver" ./cmd/mixsolver
          go build -o "$RUNNER_TEMP/oracle/csppsolver" decred.org/cspp/v2/cmd/csppsolver
      # PURSE_ORACLE_DIR applies to every oracle binary a test asks for, so
      # only this crate runs here.  Release, so the large degrees run too.
      - run: cargo test -p purse-mixsolver --release --locked --no-fail-fast
        env:
          PURSE_ORACLE_DIR: ${{ runner.temp }}/oracle

  mixsolver-speed-gate:
    name: mixsolver speed gate (ADR-0010)
    # The gate is a 1 s median at 512 roots on the slowest runner.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Build on every core; pin only the measurement.
      - run: cargo test --release -p purse-mixsolver --locked --test timing --no-run
      - run: taskset -c 0 cargo test --release -p purse-mixsolver --locked --test timing -- --ignored --exact speed_gate --nocapture

  deny:
    name: cargo-deny (licenses, advisories, sources, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    name: cargo doc (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  fuzz-smoke:
    name: fuzz smoke (60s per target)
    runs-on: ubuntu-latest
    env:
      # cargo-fuzz needs nightly, and the root rust-toolchain.toml reaches
      # into fuzz/ and must be overridden.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Run every target
        run: |
          for target in $(cargo fuzz list --fuzz-dir fuzz); do
            cargo fuzz run --fuzz-dir fuzz "$target" -- \
              -max_total_time=60 -timeout=20 -rss_limit_mb=2048 -max_len=4096
          done
