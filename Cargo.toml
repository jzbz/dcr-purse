[workspace]
resolver = "3"
members = ["crates/*"]
# cargo-fuzz targets and the decision spikes: workspaces of their own.
exclude = ["fuzz", "spikes"]

[workspace.package]
version = "0.1.0"
authors = ["The dcr-purse developers"]
edition = "2024"
# The pinned build toolchain itself (rust-toolchain.toml); bumped together.
rust-version = "1.100.0"
license = "ISC"
repository = "https://github.com/jzbz/dcr-purse"

# Decred primitives come from dcroxide at one pinned revision (brief, D3).
# Every dcroxide crate names the same `rev`; move them together.
[workspace.dependencies]
dcroxide-base58 = { git = "https://github.com/jzbz/dcroxide", rev = "1587ca1917c120f18e9be40917b1ebc6f3b197fa" }
dcroxide-chaincfg = { git = "https://github.com/jzbz/dcroxide", rev = "1587ca1917c120f18e9be40917b1ebc6f3b197fa" }
dcroxide-chainhash = { git = "https://github.com/jzbz/dcroxide", rev = "1587ca1917c120f18e9be40917b1ebc6f3b197fa" }
dcroxide-crypto = { git = "https://github.com/jzbz/dcroxide", rev = "1587ca1917c120f18e9be40917b1ebc6f3b197fa" }
dcroxide-dcrec = { git = "https://github.com/jzbz/dcroxide", rev = "1587ca1917c120f18e9be40917b1ebc6f3b197fa" }
dcroxide-dcrjson = { git = "https://github.com/jzbz/dcroxide", rev = "1587ca1917c120f18e9be40917b1ebc6f3b197fa" }
dcroxide-gcs = { git = "https://github.com/jzbz/dcroxide", rev = "1587ca1917c120f18e9be40917b1ebc6f3b197fa", default-features = false }
dcroxide-stake = { git = "https://github.com/jzbz/dcroxide", rev = "1587ca1917c120f18e9be40917b1ebc6f3b197fa", default-features = false }
dcroxide-standalone = { git = "https://github.com/jzbz/dcroxide", rev = "1587ca1917c120f18e9be40917b1ebc6f3b197fa" }
dcroxide-txscript = { git = "https://github.com/jzbz/dcroxide", rev = "1587ca1917c120f18e9be40917b1ebc6f3b197fa" }
dcroxide-wire = { git = "https://github.com/jzbz/dcroxide", rev = "1587ca1917c120f18e9be40917b1ebc6f3b197fa" }

purse-dcrutil = { path = "crates/purse-dcrutil" }
purse-errors = { path = "crates/purse-errors" }
purse-testutil = { path = "crates/purse-testutil" }
purse-txrules = { path = "crates/purse-txrules" }

# The wallet store's engine (ADR-0003 Decision item 1): one exact release,
# moved in step with dcroxide (ADR-0006 rule 5), whose lock resolves 5.0.0 at
# the pinned revision.  `std` is redb's only default feature and is needed
# for file-backed databases.
redb = "=5.0.0"

serde_json = "1"

# redb is built with optimisations in test builds too: the store's
# power-loss, migration and model suites reopen thousands of images, and
# with an unoptimised engine they took 1.6 to 4.6 times as long in two
# measurements on an x86_64 Linux desktop (the power-loss suite 2.2 to 3.1
# times: about 48 s against 105 s).  Only redb's own code is affected; the
# workspace's crates keep the dev profile, overflow checks included.
[profile.dev.package.redb]
opt-level = 3

# scrypt and the Salsa20/8 core it runs are built with optimisations in test
# builds too: purse-udb's differential creates, opens and unlocks wallets on
# testnet3 and regnet, where dcrwallet's scrypt cost is N = 2^18, r = 8
# (256 MiB, once per master key derivation). Its four hand-written scripts
# took 124 s of CPU time unoptimised and 15 s with these two crates
# optimised, on an x86_64 Linux desktop (one measurement each, on a loaded
# machine). Only these two crates are affected.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

# argon2 likewise: every per-account passphrase (purse-udb's
# SetAccountPassphrase, UnlockAccount, ImportVotingAccount, and the export's
# check of each such account) derives with dcrwallet's cost, time 1 and
# 256 MiB. One single-lane derivation took 2.00 to 2.08 s unoptimised and
# 0.11 s optimised on an x86_64 Linux desktop (three and two measurements).
# Only this crate is affected.
[profile.dev.package.argon2]
opt-level = 3

# Every dependency, and purse-hdkeychain, is built with optimisations in test
# builds too.  The seed differential (purse-udb's tests/wallet_diff.rs) runs
# two address managers on each of about 16,400 seeds in the normal suite;
# unoptimised, over 80 % of its CPU time was elliptic-curve arithmetic in
# k256, dcroxide-secp256k1-vartime and crypto-bigint (profiles of its two
# large tests, not of the whole binary: 82 % in the leading-zero test, which
# takes most of the time, and 88 % in the random-seed test; in both about a
# quarter of all samples copied field elements through memcpy), and most of
# the rest HMAC-SHA512 (8.5 % in the leading-zero test), purse-hdkeychain's
# base58 and BLAKE-256.  On GitHub's runners the binary took 781 s on
# ubuntu-24.04-arm and had not finished after 19 minutes on ubuntu-latest.
# On an x86_64 Linux desktop (unrecorded measurements on a
# shared machine) a seed cost 97.5 to 102 ms in the dev profile and 11.7 to
# 11.8 ms with this, and on four cores the binary took 465 s and 62.5 s, and
# the whole `cargo test --workspace` 1,129 s and 628 s, the hdkeychain key
# differential (tests/oracle_diff.rs) 81.5 s and 7.6 s of that.  Every
# dependency rather than a list of the hot ones (which measured 12.2 ms), so
# that the setting needs no upkeep as the graph moves and the other suites
# gain too; purse-hdkeychain because its base58 codec and the generic field
# code instantiated in it were 16 % of what remained.  The price, on four of
# the same desktop's cores with incremental compilation off as on CI: a cold
# `cargo test --workspace --no-run` took 36.6 s against 24.0 s (CI pays this
# when the dependency cache's key changes), a cold `cargo clippy` 12.2 s
# against 6.9 s, and rebuilding the workspace's own crates 13.8 s against
# 11.9 s.  Only opt-level changes: overflow checks and debug assertions stay
# on in every crate, so the dependencies' own consistency checks still run,
# and the workspace's other crates keep the dev profile.  The four entries
# above are covered by `"*"` and are kept with their measurements.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.purse-hdkeychain]
opt-level = 3

# Release binaries: single codegen unit with thin LTO, line tables kept.
# A panic aborts: state a panic left half-mutated cannot be reasoned about in
# a process that holds keys and a database.  Overflow wraps, as Go's does;
# sites that rely on it say so with `wrapping_*`.
[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
panic = "abort"
overflow-checks = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
arithmetic_side_effects = "warn"
