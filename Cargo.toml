[workspace]
resolver = "3"
members = ["crates/*"]
# cargo-fuzz targets and the decision spikes: workspaces of their own.
exclude = ["fuzz", "spikes"]

[workspace.package]
version = "0.1.0"
authors = ["The dcr-purse developers"]
edition = "2024"
# The pinned build toolchain itself (rust-toolchain.toml); bumped together.
rust-version = "1.100.0"
license = "ISC"
repository = "https://github.com/jzbz/dcr-purse"

# Decred primitives come from dcroxide at one pinned revision (brief, D3).
# Every dcroxide crate names the same `rev`; move them together.
[workspace.dependencies]
dcroxide-base58 = { git = "https://github.com/jzbz/dcroxide", rev = "f4b3d2e8f66a8394d1835c69a66fe2d968d9d8e1" }
dcroxide-chaincfg = { git = "https://github.com/jzbz/dcroxide", rev = "f4b3d2e8f66a8394d1835c69a66fe2d968d9d8e1" }
dcroxide-chainhash = { git = "https://github.com/jzbz/dcroxide", rev = "f4b3d2e8f66a8394d1835c69a66fe2d968d9d8e1" }
dcroxide-crypto = { git = "https://github.com/jzbz/dcroxide", rev = "f4b3d2e8f66a8394d1835c69a66fe2d968d9d8e1" }
dcroxide-dcrec = { git = "https://github.com/jzbz/dcroxide", rev = "f4b3d2e8f66a8394d1835c69a66fe2d968d9d8e1" }
dcroxide-dcrjson = { git = "https://github.com/jzbz/dcroxide", rev = "f4b3d2e8f66a8394d1835c69a66fe2d968d9d8e1" }
dcroxide-standalone = { git = "https://github.com/jzbz/dcroxide", rev = "f4b3d2e8f66a8394d1835c69a66fe2d968d9d8e1" }
dcroxide-txscript = { git = "https://github.com/jzbz/dcroxide", rev = "f4b3d2e8f66a8394d1835c69a66fe2d968d9d8e1" }
dcroxide-wire = { git = "https://github.com/jzbz/dcroxide", rev = "f4b3d2e8f66a8394d1835c69a66fe2d968d9d8e1" }

purse-dcrutil = { path = "crates/purse-dcrutil" }
purse-errors = { path = "crates/purse-errors" }
purse-testutil = { path = "crates/purse-testutil" }
purse-txrules = { path = "crates/purse-txrules" }

# The wallet store's engine (ADR-0003 Decision item 1): one exact release,
# moved in step with dcroxide (ADR-0006 rule 5), whose lock resolves 5.0.0 at
# the pinned revision.  `std` is redb's only default feature and is needed
# for file-backed databases.
redb = "=5.0.0"

serde_json = "1"

# redb is built with optimisations in test builds too: the store's
# power-loss, migration and model suites reopen thousands of images, and
# with an unoptimised engine they took 1.6 to 4.6 times as long in two
# measurements on an x86_64 Linux desktop (the power-loss suite 2.2 to 3.1
# times: about 48 s against 105 s).  Only redb's own code is affected; the
# workspace's crates keep the dev profile, overflow checks included.
[profile.dev.package.redb]
opt-level = 3

# scrypt and the Salsa20/8 core it runs are built with optimisations in test
# builds too: purse-udb's differential creates, opens and unlocks wallets on
# testnet3 and regnet, where dcrwallet's scrypt cost is N = 2^18, r = 8
# (256 MiB, once per master key derivation). Its four hand-written scripts
# took 124 s of CPU time unoptimised and 15 s with these two crates
# optimised, on an x86_64 Linux desktop (one measurement each, on a loaded
# machine). Only these two crates are affected.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

# Release binaries: single codegen unit with thin LTO, line tables kept.
# A panic aborts: state a panic left half-mutated cannot be reasoned about in
# a process that holds keys and a database.  Overflow wraps, as Go's does;
# sites that rely on it say so with `wrapping_*`.
[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
panic = "abort"
overflow-checks = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
arithmetic_side_effects = "warn"
