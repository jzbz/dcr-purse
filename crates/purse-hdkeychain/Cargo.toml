[package]
name = "purse-hdkeychain"
description = "Decred hierarchical deterministic extended keys: a port of dcrd's hdkeychain v3.1.3, leading-zero stripping included"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# BLAKE-256 (checksum, fingerprint) and RIPEMD-160 (fingerprint).
dcroxide-crypto.workspace = true
# secp256k1 with dcrd's exact rules: the scalar range check, the private
# child's sum and a private key's public key in constant time (dcrec
# builds them on k256, so the graph holds one k256 and this crate names it
# nowhere); the public child's sum Il*G + parent in variable time, as dcrd
# computes it; and ParsePubKey with dcrd's error texts.  no_std + alloc,
# no features.  Its error type stays private: PubKeyError is this crate's.
dcroxide-dcrec.workspace = true
# HMAC-SHA512 for master and child derivation; `zeroize` wipes the hash
# states the chain code and private key pass through, as in dcroxide-dcrec.
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
# Private key bytes, chain codes and seeds are wiped on drop.
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# Optional: NetworkParams for dcroxide-chaincfg's Params (feature `chaincfg`).
dcroxide-chaincfg = { workspace = true, optional = true }

[features]
# Implement NetworkParams for dcroxide_chaincfg::Params, which only this
# crate can do (the orphan rule).
chaincfg = ["dep:dcroxide-chaincfg"]

[dev-dependencies]
# The general base58 codec the crate's own fixed-buffer codec is tested
# against (the crate does not use it: its working vectors are not wiped).
dcroxide-base58.workspace = true
# The wallet-level differential (tests/wallet_diff.rs) and the upstream
# examples: each network's coin types and address prefixes, and the P2PKH
# address encoding dcr-purse uses (stdaddr), at the dcroxide pin;
# dcroxide-txscript without `std`, which adds only the signature cache.
dcroxide-chaincfg.workspace = true
dcroxide-txscript.workspace = true
# Renders the one wallet-level error dcrwallet wraps (an unusable seed).
purse-errors.workspace = true
purse-testutil.workspace = true

[lints]
workspace = true
