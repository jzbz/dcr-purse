[package]
name = "purse-store"
description = "dcr-purse's own wallet store on redb 5: the ADR-0003 schema, typed transactions, bbolt-ordered cursors, schema versioning and durability modes"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# BLAKE-256, the digest of every row a backup copies, which its backup
# record carries (ADR-0018 Decision item 1 names it). dcroxide's own port,
# already in the workspace graph; its default features are empty (`rand`
# stays off).
dcroxide-crypto.workspace = true
# Op/Kind: store errors convert into the wallet-wide error model (ADR-0011).
purse-errors.workspace = true
# The engine (ADR-0003 Decision item 1), pinned exactly in the root manifest.
redb.workspace = true
# SHA-256 of a HASH160, the key of dcrwallet's per-account address order
# (`addr_by_acct_sha`, ADR-0003 Decision item 3). The release already in the
# lock file; no default features.
sha2 = { version = "0.11.1", default-features = false }

[target.'cfg(unix)'.dependencies]
# `O_NONBLOCK`, so that opening the file handed to `verify_backup` cannot
# block on a FIFO with no writer before its type is checked on the handle;
# its value differs between Unix systems and architectures, which a
# constant of the store's own would have to track. Bindings only (no C is
# compiled), and the release already in the lock file through redb; no
# default features.
libc = { version = "0.2.191", default-features = false }

[dev-dependencies]
# SplitMix64 for the seeded property tests.
purse-testutil.workspace = true
# dcrd's header serialization, already in the workspace: the header fields
# the chain operations read (height, previous block) are checked against
# it.
dcroxide-wire.workspace = true

[lints]
workspace = true
