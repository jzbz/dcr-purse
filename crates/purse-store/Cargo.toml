[package]
name = "purse-store"
description = "dcr-purse's own wallet store on redb 5: the ADR-0003 schema, typed transactions, bbolt-ordered cursors, schema versioning and durability modes"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Op/Kind: store errors convert into the wallet-wide error model (ADR-0011).
purse-errors.workspace = true
# The engine (ADR-0003 Decision item 1), pinned exactly in the root manifest.
redb.workspace = true
# SHA-256 of a HASH160, the key of dcrwallet's per-account address order
# (`addr_by_acct_sha`, ADR-0003 Decision item 3). The release already in the
# lock file; no default features.
sha2 = { version = "0.11.1", default-features = false }

[dev-dependencies]
# SplitMix64 for the seeded property tests.
purse-testutil.workspace = true

[lints]
workspace = true
