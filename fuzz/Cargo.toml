[package]
name = "purse-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "ISC"

[package.metadata]
cargo-fuzz = true

# A workspace of its own: cargo-fuzz needs nightly and sanitizer flags the
# main workspace must not inherit.  Run with RUSTUP_TOOLCHAIN=nightly, since
# the root rust-toolchain.toml reaches into this directory.
[workspace]

[dependencies]
# The types the txauthor target builds its transactions, scripts, keys and
# networks from, and the script engine it verifies signatures with: already
# in the graph through purse-txauthor.  The rev is the root workspace's
# dcroxide pin and moves with it.
dcroxide-chaincfg = { git = "https://github.com/jzbz/dcroxide", rev = "2074168ddda31bf49da34e8d20688359931b7a77" }
dcroxide-chainhash = { git = "https://github.com/jzbz/dcroxide", rev = "2074168ddda31bf49da34e8d20688359931b7a77" }
dcroxide-dcrec = { git = "https://github.com/jzbz/dcroxide", rev = "2074168ddda31bf49da34e8d20688359931b7a77" }
dcroxide-txscript = { git = "https://github.com/jzbz/dcroxide", rev = "2074168ddda31bf49da34e8d20688359931b7a77" }
dcroxide-wire = { git = "https://github.com/jzbz/dcroxide", rev = "2074168ddda31bf49da34e8d20688359931b7a77" }
libfuzzer-sys = "0.4"
purse-boltread = { path = "../crates/purse-boltread" }
purse-dcrutil = { path = "../crates/purse-dcrutil" }
purse-errors = { path = "../crates/purse-errors" }
purse-hdkeychain = { path = "../crates/purse-hdkeychain" }
purse-mixsolver = { path = "../crates/purse-mixsolver" }
purse-seed = { path = "../crates/purse-seed" }
purse-store = { path = "../crates/purse-store" }
purse-txauthor = { path = "../crates/purse-txauthor" }
purse-txrules = { path = "../crates/purse-txrules" }
purse-udb = { path = "../crates/purse-udb" }
sntrup4591761 = { path = "../crates/sntrup4591761" }

[[bin]]
name = "seed_decode"
path = "fuzz_targets/seed_decode.rs"
test = false
doc = false
bench = false

