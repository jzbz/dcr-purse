[package]
name = "store-redb-spike"
description = "Phase 0 spike for decision D2: a redb schema prototype for the wallet store, measured against dcrwallet's udb on the same workload"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.100.0"
license = "ISC"

# A workspace of its own (the root manifest excludes spikes/): a spike is
# throwaway code and must not join the main workspace's graph, lints or
# lock file.
[workspace]

[dependencies]
# The engine under test: redb 5, the major the project owner chose
# (ADR-0003).  The spike was also run on 4.5.0, the release dcroxide locked
# until its f4b3d2e moved to redb 5.0.0; ADR-0003 has both.  Keep REDB_VERSION in src/lib.rs equal to this.
redb = "=5.0.0"
# Transactions and block headers in Decred's wire format, so the generated
# history hashes exactly as dcrwallet hashes it.
dcroxide-wire = { git = "https://github.com/jzbz/dcroxide", rev = "1587ca1917c120f18e9be40917b1ebc6f3b197fa" }
dcroxide-chainhash = { git = "https://github.com/jzbz/dcroxide", rev = "1587ca1917c120f18e9be40917b1ebc6f3b197fa" }
# BLAKE-256 and RIPEMD-160 for HASH160 of derived public keys.
dcroxide-crypto = { git = "https://github.com/jzbz/dcroxide", rev = "1587ca1917c120f18e9be40917b1ebc6f3b197fa" }
# Address derivation, so the generated scripts pay to the addresses the Go
# address manager derives from the same seed.
purse-hdkeychain = { path = "../../crates/purse-hdkeychain" }
# SplitMix64, the oracle harness and serde_json.
purse-testutil = { path = "../../crates/purse-testutil" }
# SHA-256 of HASH160, the key of dcrwallet's per-account address order
# (already in this lock file through purse-hdkeychain).
sha2 = { version = "=0.11.1", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
panic = "abort"
overflow-checks = false

# Tests run the store in debug builds; the prototype's B-tree work is slow
# unoptimised, so dependencies are optimised even there.
[profile.dev.package."*"]
opt-level = 2
